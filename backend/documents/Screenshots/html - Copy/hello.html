 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>raksh&sanjjith</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: beige;
        }

        .proposal-container {
            width: 80%;
            margin: 40px auto;
            text-align: center;
        }

        .animated-title {
            font-size: 36px;
            animation: fadeIn 4s ease-in-out;
        }

        .animated-btn {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            animation: pulse 3s infinite;
        }

        #proposal-message {
            margin-top: 20px;
        }

        .animated-text {
            font-size: 24px;
            animation: fadeInUp 3s ease-in-out;
        }

        .hidden {
            display: none;
        }

        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 300px;
            color: red;
            animation: heart-beat 5s infinite;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes heart-beat {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="proposal-container">
        <h1 class="animated-title">Message from your husband olunga open pannu</h1>
        <button id="proposal-btn" class="animated-btn">Click Here</button>
        <div id="proposal-message" class="hidden">
            <p class="animated-text">Eruma madu evlo miss panra theriyuma</p>
            <p class="animated-text">Enaya epo marriage panipa</p>
            <p class="animated-text">enaku un pakathula erukanum pola eruku</p>
            <p class="animated-text">Miss u a lott rakshu</p>
        </div>
        <span class="heart">&hearts;</span>
    </div>

    <script>
        document.getElementById('proposal-btn').addEventListener('click', function() {
            document.getElementById('proposal-message').classList.remove('hidden');
        });
    </script>
</body>
</html>
